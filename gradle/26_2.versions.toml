[versions]
minecraft-range = "26.2.x"
minecraft = "26.2"

sbapi-mc-version = "26.2"
fabric-api = "0.152.0+26.2"

resourceful-lib = "5.0.2"
resourceful-config = "5.0.0"
olympus = "1.9.3"
placeholders = "3.1.0-beta.1+26.2"

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }

fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }

resourceful-lib = { module = "com.teamresourceful.resourcefullib:resourcefullib-fabric-26.2", version.ref = "resourceful-lib" }
resourceful-config = { module = "com.teamresourceful.resourcefulconfig:resourcefulconfig-fabric-26.2", version.ref = "resourceful-config" }
olympus = { module = "earth.terrarium.olympus:olympus-fabric-26.2", version.ref = "olympus" }
placeholders = { module = "eu.pb4:placeholder-api", version.ref = "placeholders" }

# Skysoft ships an MC 26.1 and an MC 26.2 build under the same version number, so the Modrinth
# version id is used instead of "0.1.15" to pin the right one.
# Compile-only: used by the craft-helper Skysoft compat (me.owdding.skyocean.compat.skysoft / mixins.compat.skysoft).
skysoft = { module = "maven.modrinth:skysoft", version = "ZP95BWhv" }
